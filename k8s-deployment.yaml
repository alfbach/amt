apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfs-migration-toolkit
  labels:
    app: alfs-migration-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfs-migration-toolkit
  template:
    metadata:
      labels:
        app: alfs-migration-toolkit
    spec:
      containers:
        - name: app
          image: alfs-migration-toolkit:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alfs-migration-toolkit
  labels:
    app: alfs-migration-toolkit
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
      name: http
  selector:
    app: alfs-migration-toolkit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alfs-migration-toolkit
  labels:
    app: alfs-migration-toolkit
  annotations:
    # Nginx Ingress: WebSocket-Support für Streamlit
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
spec:
  ingressClassName: nginx
  rules:
    - host: alfs-migration.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alfs-migration-toolkit
                port:
                  number: 80
  # Optional: TLS aktivieren (Secret mit Zertifikat vorher anlegen)
  # tls:
  #   - hosts:
  #       - alfs-migration.example.com
  #     secretName: alfs-migration-tls
