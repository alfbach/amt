apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfs-migration-toolkit
  namespace: vma
  labels:
    app: alfs-migration-toolkit
    app.kubernetes.io/name: alfs-migration-toolkit
    app.kubernetes.io/part-of: vma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alfs-migration-toolkit
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: alfs-migration-toolkit
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/vma/alfs-migration-toolkit:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          env:
            - name: HOME
              value: /app
            - name: TMPDIR
              value: /tmp
            - name: STREAMLIT_SERVER_MAX_UPLOAD_SIZE
              value: "200"
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
