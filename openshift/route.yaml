apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: alfs-migration-toolkit
  namespace: vma
  labels:
    app: alfs-migration-toolkit
  annotations:
    # Große RVTools-XLSX-Uploads und lange Streamlit-Sessions
    haproxy.router.openshift.io/timeout: 3600s
    # Sticky Sessions für Streamlit WebSockets / Session-State
    haproxy.router.openshift.io/balance: source
spec:
  to:
    kind: Service
    name: alfs-migration-toolkit
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
